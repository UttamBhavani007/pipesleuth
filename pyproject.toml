[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipesleuth"
version = "0.1.0.dev1"
description = "A local, reproducible data-pipeline incident investigation lab"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Uttam Bhavani"}]
dependencies = []

[project.scripts]
pipesleuth = "pipesleuth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
