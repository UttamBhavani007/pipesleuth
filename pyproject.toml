[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipesleuth"
version = "0.1.0.dev1"
description = "A local, reproducible data-pipeline incident investigation lab"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Uttam Bhavani"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.162.0", "uvicorn==0.54.0"]
test-api = ["httpx==0.28.1"]

[project.scripts]
pipesleuth = "pipesleuth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipesleuth = ["web/*.html", "web/*.css", "web/*.mjs"]
